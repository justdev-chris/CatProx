<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CatProx 🐾</title>
<style>
  body { background-color: #121212; color: #eee; font-family: sans-serif; margin:0; padding:0; overflow-x:hidden; }
  header { background:#1e1e1e; padding:15px; text-align:center; position:sticky; top:0; z-index:999; }
  header input { width:60%; padding:6px; border-radius:5px; border:none; }
  header button { padding:6px 12px; border-radius:5px; border:none; background:#4ee; color:#121212; cursor:pointer; }
  #proxy-container { padding:20px; }
  a { color:#4ee; }
</style>
</head>
<body>
<header>
  <h1>CatProx 🐾</h1>
  <input type="text" id="url" placeholder="Enter URL here">
  <button id="go">Go!</button>
  <div>Current URL: <span id="current-url">None</span></div>
</header>

<div id="proxy-container">Enter a URL above and hit Go!</div>

<script>
const proxyBase = '/api/proxy?url=';
const container = document.getElementById('proxy-container');
const urlInput = document.getElementById('url');
const goBtn = document.getElementById('go');
const currentUrlDisplay = document.getElementById('current-url');

let currentURL = '';

function toAbsolute(base, relative) {
    try {
        return new URL(relative, base).href;
    } catch {
        return relative;
    }
}

async function fetchAndInject(url) {
    try {
        const res = await fetch(proxyBase + url);
        let html = await res.text();
        
        // Rewrite all relative links to proxy
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const baseURL = url;

        // Links
        doc.querySelectorAll('a[href]').forEach(a => {
            const abs = toAbsolute(baseURL, a.getAttribute('href'));
            a.onclick = (e) => { e.preventDefault(); loadURL(abs); };
            a.setAttribute('href', '#');
        });

        // Scripts
        doc.querySelectorAll('script[src]').forEach(s => {
            const abs = toAbsolute(baseURL, s.src);
            s.src = proxyBase + abs;
        });

        // Stylesheets
        doc.querySelectorAll('link[rel="stylesheet"]').forEach(l => {
            const abs = toAbsolute(baseURL, l.href);
            l.href = proxyBase + abs;
        });

        // Images
        doc.querySelectorAll('img[src]').forEach(img => {
            const abs = toAbsolute(baseURL, img.src);
            img.src = proxyBase + abs;
        });

        // Forms
        doc.querySelectorAll('form[action]').forEach(f => {
            const abs = toAbsolute(baseURL, f.action);
            f.onsubmit = async (e) => {
                e.preventDefault();
                const formData = new FormData(f);
                const method = f.method.toUpperCase();
                const formURL = proxyBase + abs;
                await fetch(formURL, { method, body: formData });
                loadURL(baseURL); // reload current page after submit
            };
        });

        container.innerHTML = '';
        doc.body.querySelectorAll('*').forEach(node => container.appendChild(node.cloneNode(true)));
        currentURL = url;
        currentUrlDisplay.textContent = currentURL;
    } catch(err) {
        container.innerHTML = `<p style="color:red;">Error fetching URL: ${err}</p>`;
    }
}

function loadURL(url) {
    fetchAndInject(url);
}

goBtn.addEventListener('click', () => {
    loadURL(urlInput.value);
});
</script>
</body>
</html>
